name: Deploy Website to Production

on:
  push:
    branches:
      - website-live

jobs:
  deploy-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: ./website
        run: npm ci

      - name: Install pitch deck dependencies
        working-directory: ./website/pitch-deck
        run: npm ci

      - name: Build pitch deck
        working-directory: ./website
        run: npm run build:pitch-deck

      - name: Build website (static export)
        working-directory: ./website
        run: npx next build
        env:
          NODE_ENV: production

      - name: Verify build output
        working-directory: ./website
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Build output directory 'out/' not found!"
            exit 1
          fi
          FILE_COUNT=$(find out -type f | wc -l)
          TOTAL_SIZE=$(du -sh out | cut -f1)
          echo "✅ Build output: $FILE_COUNT files, $TOTAL_SIZE total"
          echo ""
          echo "── Pages ──"
          find out -name "*.html" | sort
          echo ""
          echo "── Assets ──"
          find out -name "*.js" -o -name "*.css" | head -20


      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --project squareup-website --only hosting:website-production --force --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Post-deploy verification
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  🚀 Website deployed to joinsquareup.com"
          echo "════════════════════════════════════════════════"
          echo ""
          echo "Verify at: https://joinsquareup.com"
          echo "Commit:    ${{ github.sha }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Time:      $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
